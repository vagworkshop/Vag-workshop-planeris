services:
  - type: web
    name: autoservisas-kalendorius
    env: node
    plan: starter
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: kalendorius-data
      mountPath: /var/data
      sizeGB: 1
